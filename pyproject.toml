[project]
name = "etfmom"
version = "0.1.0"
description = "ML4T midterm: cross-asset ETF momentum with a volatility-state gate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "optuna>=4.0",
  "shap>=0.46",
  "matplotlib>=3.9",
  "pyyaml>=6",
  "yfinance>=0.2.50",
  "jupytext>=1.16",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "ipykernel>=6.29",
  "python-pptx>=1.0",
  "markdown>=3.6",
  "python-docx>=1.2.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/etfmom"]
